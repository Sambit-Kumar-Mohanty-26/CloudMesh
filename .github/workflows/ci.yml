name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck needs @prisma/client's generated types, which are
      # schema-driven only — no live DB connection required for this step.
      - run: npm run generate --workspace=@cloudmesh/db

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # Scoped to runtime dependencies on purpose: dev tooling (vitest's
      # esbuild/vite chain) currently carries known advisories in code paths
      # this project never runs (a dev server we don't start). Blocking CI
      # on those would be noise, not signal — see CLAUDE.md. Anything that
      # actually ships is held to a hard gate.
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: Test (real Postgres + Redis)
    runs-on: ubuntu-latest
    env:
      # Superuser connection, used only to apply migrations here — mirrors
      # docker-compose.yml exactly so local and CI behavior match.
      DATABASE_URL: postgresql://cloudmesh:cloudmesh@localhost:55432/cloudmesh
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cloudmesh
          POSTGRES_PASSWORD: cloudmesh
          POSTGRES_DB: cloudmesh
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cloudmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # NOTE: NATS is deliberately NOT a service container. JetStream has to
      # be enabled with the `-js` server flag, and `services:` has no way to
      # override an image's command — only `options:`, which passes docker
      # create flags, not args. So it's started with an explicit `docker run`
      # step below, mirroring docker-compose.yml exactly.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # See the note in `services:` for why this isn't a service container.
      # -js enables JetStream; without it stream creation fails outright.
      - name: Start NATS JetStream
        run: |
          docker run -d --name cloudmesh-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz > /dev/null; then
              echo "NATS ready"; exit 0
            fi
            sleep 1
          done
          echo "NATS failed to become ready"; docker logs cloudmesh-nats; exit 1

      # migrate:deploy (not migrate:dev) — applies existing migrations
      # non-interactively, never generates a new one. This is also what
      # creates the RLS policies, the pgvector extension/index, and the
      # non-superuser cloudmesh_app role that the tests connect as.
      - run: npm run migrate:deploy --workspace=@cloudmesh/db

      - run: npm run generate --workspace=@cloudmesh/db

      # Each service's vitest.config.ts hardcodes its own test env
      # (matching these exact service ports/credentials) — nothing further
      # to pass in here. packages/auth's tests are pure (no DB/Redis) but
      # run alongside these for one consolidated report. packages/rate-
      # limiter and packages/circuit-breaker need Redis only — each reads
      # REDIS_URL itself. packages/billing needs Postgres only (budget
      # status is pure DB logic, no Redis/lock involved at that layer).
      - run: npm test --workspace=@cloudmesh/auth
      # packages/telemetry (span helper, no OTLP network calls in its
      # tests — a real BasicTracerProvider + InMemorySpanExporter, same
      # spirit as MockAgent-based provider adapter tests elsewhere) and
      # packages/metrics (prom-client registry + a real, but network-free,
      # Fastify app) are both pure too — grouped here for the same reason.
      - run: npm test --workspace=@cloudmesh/telemetry
      - run: npm test --workspace=@cloudmesh/metrics
      - run: npm test --workspace=@cloudmesh/billing
      # packages/events has both pure schema tests and real JetStream
      # integration tests — hence the NATS step above.
      - run: npm test --workspace=@cloudmesh/events
      # packages/jobs' own tests are pure (priority mapping, registry,
      # progress math) — the queue/worker itself is covered by real
      # BullMQ-backed integration tests in @cloudmesh/gateway below.
      - run: npm test --workspace=@cloudmesh/jobs
      - run: npm test --workspace=@cloudmesh/rate-limiter
      - run: npm test --workspace=@cloudmesh/circuit-breaker
      # packages/outbox needs Postgres only (extracted from apps/gateway in
      # Phase 11 so apps/api could write outbox rows for api_key events too).
      - run: npm test --workspace=@cloudmesh/outbox
      # packages/webhooks needs both: SSRF/HMAC/HTTP-classification tests are
      # pure, but its pipeline.test.ts runs a real BullMQ worker end to end
      # (dispatch -> queue -> HTTP -> DB), the same "queue/worker covered by
      # real integration tests" pattern as jobs above, just inside this
      # package rather than @cloudmesh/gateway.
      - run: npm test --workspace=@cloudmesh/webhooks
      - run: npm test --workspace=@cloudmesh/api
      - run: npm test --workspace=@cloudmesh/gateway

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloudmesh
      POSTGRES_PASSWORD: cloudmesh
      POSTGRES_DB: cloudmesh
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # NATS with JetStream enabled (-js). JetStream is what makes this a
  # persisted, at-least-once bus rather than fire-and-forget core NATS —
  # without the flag, streams can't be created at all and every publish
  # from the outbox poller would fail. 4222 is the client port; 8222 is the
  # HTTP monitoring endpoint, which is also the cheapest healthcheck.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  # Phase 12 observability stack. apps/api and apps/gateway run on the HOST
  # (npm run dev), not in this compose file, so Prometheus scrapes them via
  # host.docker.internal — Docker Desktop (Windows/Mac) resolves this
  # automatically; the extra_hosts entry is what makes it also resolve on
  # Linux Docker Engine.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP — @cloudmesh/telemetry's exporter default target
      - "4317:4317" # OTLP gRPC — unused by this codebase's exporter, exposed for completeness

  prometheus:
    image: prom/prometheus:v2.55.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      # Local dev convenience, not a real credential — see CLAUDE.md's rule
      # on labeling dev-only passwords. Anonymous admin access is fine for
      # a stack that only ever runs on localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: cloudmesh_dev_only
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Grafana's own default port (3000, inside the container) collides
      # with apps/api's host port — only the host-side mapping moves.
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  nats_data:

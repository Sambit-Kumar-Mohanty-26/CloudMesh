# TEMPLATE ONLY — every value below is a placeholder, not a usable
# credential. Do NOT `kubectl apply -f` this file as-is in any real
# environment. Two real options instead:
#   1. Copy to secret.local.yaml (gitignored), fill in real values, apply
#      that file — fine for a personal/learning cluster.
#   2. For anything that matters, don't commit secrets as YAML at all: use
#      `kubectl create secret generic cloudmesh-secrets --from-literal=...`
#      directly, or a real secrets manager (Sealed Secrets, External
#      Secrets Operator, Vault) that keeps the plaintext out of git
#      entirely. This repo doesn't wire either up — same "no live
#      credentials in this environment" caveat as every provider adapter.
apiVersion: v1
kind: Secret
metadata:
  name: cloudmesh-secrets
  namespace: cloudmesh
type: Opaque
stringData:
  # Postgres. cloudmesh_app is the RLS-bound non-superuser role every
  # service actually connects as — see packages/db/ER_DIAGRAM.md.
  #
  # POSTGRES_PASSWORD (the bootstrap superuser) is freely changeable — it's
  # whatever the postgres image's own POSTGRES_PASSWORD env var is set to
  # at first init (see 10-postgres.yaml). cloudmesh_app's password is NOT
  # freely changeable the same way: the role is created by
  # packages/db/prisma/migrations/20260715090000_app_role, which hardcodes
  # `PASSWORD 'cloudmesh_app'` as a literal in the migration SQL, not an
  # env-injected value — that migration's own comment says this moves to a
  # secrets manager "in Phase 2," but that follow-through never happened.
  # APP_DATABASE_URL below MUST use that exact literal password for the
  # app role to actually authenticate; changing it here does nothing
  # without also adding a migration that ALTERs the role's password from a
  # real secret post-bootstrap — a real gap, flagged rather than papered
  # over with a placeholder that would silently fail to connect.
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://cloudmesh:CHANGE_ME@postgres:5432/cloudmesh"
  APP_DATABASE_URL: "postgresql://cloudmesh_app:cloudmesh_app@postgres:5432/cloudmesh"

  # Must be >= 32 chars — generate with: openssl rand -base64 48
  JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM_xxxxxxxxxxxxxxxxxxxxx"

  # All optional — every adapter degrades gracefully with these unset (see
  # each app's .env.example for the exact behavior).
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  RESEND_API_KEY: ""

# TEMPLATE ONLY — every value below is a placeholder, not a usable
# credential. Do NOT `kubectl apply -f` this file as-is in any real
# environment. Two real options instead:
#   1. Copy to secret.local.yaml (gitignored), fill in real values, apply
#      that file — fine for a personal/learning cluster.
#   2. For anything that matters, don't commit secrets as YAML at all: use
#      `kubectl create secret generic cloudmesh-secrets --from-literal=...`
#      directly, or a real secrets manager (Sealed Secrets, External
#      Secrets Operator, Vault) that keeps the plaintext out of git
#      entirely. This repo doesn't wire either up — same "no live
#      credentials in this environment" caveat as every provider adapter.
apiVersion: v1
kind: Secret
metadata:
  name: cloudmesh-secrets
  namespace: cloudmesh
type: Opaque
stringData:
  # Postgres. cloudmesh_app is the RLS-bound non-superuser role every
  # service actually connects as — see packages/db/ER_DIAGRAM.md.
  #
  # POSTGRES_PASSWORD (the bootstrap superuser) is whatever the postgres
  # image's own POSTGRES_PASSWORD env var is set to at first init (see
  # 10-postgres.yaml).
  #
  # cloudmesh_app's password IS now freely changeable, but not by editing
  # this file alone. The role is created by
  # packages/db/prisma/migrations/20260715090000_app_role with the literal
  # `PASSWORD 'cloudmesh_app'` — unavoidable, since Prisma applies static
  # .sql files with no way to interpolate an env var. The rotation step
  # that was missing now exists: `npm run db:rotate-app-password
  # --workspace=@cloudmesh/db` reads APP_DB_PASSWORD and ALTERs the role.
  # Run it right after migrate:deploy (15-migrate-job.yaml does both), and
  # keep APP_DB_PASSWORD below identical to the password inside
  # APP_DATABASE_URL or the app will fail to authenticate.
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://cloudmesh:CHANGE_ME@postgres:5432/cloudmesh"
  APP_DATABASE_URL: "postgresql://cloudmesh_app:CHANGE_ME_16_CHARS_MINIMUM@postgres:5432/cloudmesh"

  # Must be >= 32 chars — generate with: openssl rand -base64 48
  JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM_xxxxxxxxxxxxxxxxxxxxx"

  # Encrypts apps/dashboard's own session cookie (AES-256-GCM). Must be
  # >= 32 chars and DIFFERENT from JWT_SECRET — they protect different
  # things and reusing one key for two purposes means a leak of either
  # compromises both. Generate separately: openssl rand -base64 48
  # Rotating it logs every dashboard user out, by design.
  SESSION_SECRET: "CHANGE_ME_A_DIFFERENT_32_CHAR_MINIMUM_SECRET_yyyy"

  # The cloudmesh_app role's real password, set by
  # `npm run db:rotate-app-password --workspace=@cloudmesh/db` after
  # migrations run (see k8s/15-migrate-job.yaml). Must match the password
  # embedded in APP_DATABASE_URL above.
  APP_DB_PASSWORD: "CHANGE_ME_16_CHARS_MINIMUM"

  # All optional — every adapter degrades gracefully with these unset (see
  # each app's .env.example for the exact behavior).
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  RESEND_API_KEY: ""

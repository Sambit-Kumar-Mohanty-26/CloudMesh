# Single instance, not the design doc's "3 masters + 3 replicas" Redis
# Cluster — same accepted learning-build trade-off as postgres.yaml. A
# real production deployment would use a managed Redis (ElastiCache/
# Memorystore) instead — see k8s/COST.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cloudmesh
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cloudmesh
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - port: 6379

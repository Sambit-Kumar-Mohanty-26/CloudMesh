# Applies migrations (RLS policies, pgvector extension/index, the
# cloudmesh_app role) before any app Deployment starts. Plain manifests
# have no install-hook concept, so this is a standalone Job — run it
# manually after postgres is up and before applying 20+ (a Helm chart
# would wire this as a pre-install/pre-upgrade hook instead):
#   kubectl apply -f k8s/15-migrate-job.yaml
#   kubectl wait --for=condition=complete job/migrate -n cloudmesh --timeout=120s
# Re-running is safe — `prisma migrate deploy` is idempotent (skips
# already-applied migrations).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: cloudmesh
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # NOT cloudmesh-api:latest. That image runs `npm prune
          # --omit=dev` and deletes npm itself, which removes the Prisma
          # CLI (a devDependency of packages/db) — migrations genuinely
          # cannot run from it. This is the `base` target of the same
          # Dockerfile, built before that prune:
          #   docker build -f apps/api/Dockerfile --target base \
          #     -t cloudmesh-migrator:latest .
          image: cloudmesh-migrator:latest
          # Two steps, in this order and in one shell so the Job's
          # completion means BOTH finished:
          #   1. migrate:deploy — idempotent, safe to re-run.
          #   2. db:rotate-app-password — replaces the bootstrap literal
          #      'cloudmesh_app' password (hardcoded in the Phase 1
          #      migration, which cannot read env vars) with the real
          #      secret. Also idempotent: it just re-ALTERs the role.
          # Both run as the superuser DATABASE_URL; cloudmesh_app cannot
          # alter its own role.
          command: ["sh", "-c"]
          args:
            - >-
              npm run migrate:deploy --workspace=@cloudmesh/db &&
              npm run db:rotate-app-password --workspace=@cloudmesh/db
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: cloudmesh-secrets, key: DATABASE_URL }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cloudmesh-secrets, key: APP_DB_PASSWORD }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }

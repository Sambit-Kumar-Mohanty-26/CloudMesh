# The webhook delivery worker (Phase 11) — drains the BullMQ webhook
# queue that gateway-consumers' dispatch subscriber only enqueues to. Same
# horizontal-scaling shape as gateway-worker (BullMQ concurrency scales
# with replica count), separate Deployment so its resource profile
# (outbound HTTP to arbitrary customer endpoints, SSRF-gated) can be
# tuned/scaled independently of the job worker's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-webhook-worker
  namespace: cloudmesh
  labels: { app: gateway-webhook-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway-webhook-worker }
  template:
    metadata:
      labels: { app: gateway-webhook-worker }
    spec:
      containers:
        - name: gateway-webhook-worker
          image: cloudmesh-gateway:latest
          command: ["node_modules/.bin/tsx", "apps/gateway/src/instrument.ts", "webhookWorker"]
          envFrom:
            - configMapRef: { name: cloudmesh-config }
            - secretRef: { name: cloudmesh-secrets }
          env:
            - name: OTEL_SERVICE_NAME
              value: cloudmesh-gateway-webhook-worker
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }

# The async job queue worker (Phase 9) — a separate process from the HTTP
# server on purpose (README: "a job that pins a CPU takes down a worker,
# not the API serving every tenant's chat traffic"). No Service and no
# HTTP readiness/liveness probe: this process never listens on a port, it
# only drains BullMQ. Liveness here just means "the container is still
# running" (k8s' own default), which is enough — a wedged worker still
# holding its BullMQ lock is a job-queue-depth alert, not a probe concern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker
  namespace: cloudmesh
  labels: { app: gateway-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway-worker }
  template:
    metadata:
      labels: { app: gateway-worker }
    spec:
      containers:
        - name: gateway-worker
          image: cloudmesh-gateway:latest
          command: ["node_modules/.bin/tsx", "apps/gateway/src/instrument.ts", "worker"]
          envFrom:
            - configMapRef: { name: cloudmesh-config }
            - secretRef: { name: cloudmesh-secrets }
          env:
            - name: OTEL_SERVICE_NAME
              value: cloudmesh-gateway-worker
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }

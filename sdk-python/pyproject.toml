[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudmesh-sdk"
version = "0.1.0"
description = "Official Python SDK for the CloudMesh AI gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cloudmesh", "ai", "llm", "gateway", "openai", "anthropic", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
]
# Deliberately no runtime dependencies: built on urllib from the standard
# library so this can be installed anywhere without resolution conflicts.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["cloudmesh"]
